<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LexisGraph — Legal document intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDE3C8;
    --paper-deep: #E3D6AF;
    --ink: #1A2238;
    --seal: #7A1F2B;
    --seal-dim: #93394480;
    --slate: #5B6470;
    --brass: #A6862C;
    --rule: #C9BFA0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 34px, rgba(91,100,112,0.055) 35px);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 700px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 20px;
    margin-bottom: 36px;
  }

  .wordmark {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  .wordmark .glyph {
    color: var(--seal);
  }

  .tagline {
    font-size: 13px;
    color: var(--slate);
    margin-top: 6px;
    font-style: italic;
  }

  .settings-toggle {
    background: none;
    border: 1px solid var(--rule);
    border-radius: 3px;
    color: var(--slate);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 7px 11px;
    cursor: pointer;
    text-transform: uppercase;
    transition: border-color 0.15s ease, color 0.15s ease;
    white-space: nowrap;
  }
  .settings-toggle:hover { border-color: var(--brass); color: var(--ink); }
  .settings-toggle:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .settings-panel {
    display: none;
    border: 1px solid var(--rule);
    background: rgba(255,255,255,0.35);
    padding: 16px 18px;
    margin-bottom: 28px;
    border-radius: 3px;
  }
  .settings-panel.open { display: block; }

  .settings-panel label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--slate);
    margin-bottom: 8px;
  }

  .settings-row {
    display: flex;
    gap: 8px;
  }

  .settings-panel input[type="password"],
  .settings-panel input[type="text"] {
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 9px 10px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
  }
  .settings-panel input:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }

  .settings-save {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    padding: 0 16px;
    cursor: pointer;
  }
  .settings-save:hover { background: #2b3555; }

  .key-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--slate);
    margin-top: 8px;
  }
  .key-status.set { color: #3d6b3d; }

  .brief {
    margin-bottom: 8px;
  }

  .brief label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--slate);
    margin-bottom: 10px;
  }

  textarea {
    width: 100%;
    min-height: 92px;
    resize: vertical;
    font-family: 'Fraunces', serif;
    font-size: 18px;
    line-height: 1.5;
    padding: 16px 18px;
    border: 1px solid var(--ink);
    border-radius: 2px;
    background: #fff;
    color: var(--ink);
  }
  textarea::placeholder { color: #9a9484; font-style: italic; }
  textarea:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .brief-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
  }

  .hint {
    font-size: 12px;
    color: var(--slate);
  }

  .ask-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--seal);
    color: #F4EEDD;
    border: none;
    padding: 12px 26px;
    border-radius: 2px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .ask-btn:hover:not(:disabled) { background: #8f2534; }
  .ask-btn:active:not(:disabled) { transform: translateY(1px); }
  .ask-btn:disabled { background: #b09aa0; cursor: not-allowed; }
  .ask-btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .results { margin-top: 44px; }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--slate);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 16px;
  }

  .loading {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 28px 4px;
    color: var(--slate);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .loading.active { display: flex; }

  .stamp-dots { display: inline-flex; gap: 4px; }
  .stamp-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--seal);
    animation: stampPulse 1.1s ease-in-out infinite;
  }
  .stamp-dots span:nth-child(2) { animation-delay: 0.15s; }
  .stamp-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes stampPulse {
    0%, 60%, 100% { opacity: 0.25; transform: scale(0.85); }
    30% { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .stamp-dots span { animation: none; opacity: 0.7; }
    .ruling { animation: none !important; }
  }

  .ruling {
    border-top: 1px solid var(--ink);
    padding-top: 24px;
    animation: rise 0.35s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .ruling-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .seal-glyph {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #9c3040, var(--seal) 65%, #5e1620 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    color: #f2e4c8;
    font-size: 14px;
  }

  .ruling-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--slate);
  }

  .answer-text {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .meta-row {
    display: flex;
    gap: 18px;
    margin-top: 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--slate);
  }

  .sources {
    margin-top: 28px;
    border-top: 1px dashed var(--rule);
    padding-top: 18px;
  }

  .sources-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--slate);
    margin-bottom: 12px;
  }

  .source-item {
    border: 1px solid var(--rule);
    border-radius: 2px;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.4);
  }

  .source-toggle {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 10px 14px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .source-toggle:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }

  .source-num { color: var(--seal); font-weight: 500; }
  .source-doc { color: var(--slate); flex: 1; margin-left: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .source-chevron { color: var(--slate); font-size: 10px; transition: transform 0.15s ease; }
  .source-item.open .source-chevron { transform: rotate(90deg); }

  .source-excerpt {
    display: none;
    padding: 0 14px 14px;
    font-size: 13px;
    line-height: 1.55;
    color: var(--slate);
    border-top: 1px solid var(--rule);
    padding-top: 12px;
  }
  .source-item.open .source-excerpt { display: block; }

  .error-box {
    border: 1px solid var(--seal);
    background: #f6e9e6;
    color: #5e1620;
    padding: 16px 18px;
    border-radius: 2px;
    font-size: 14px;
    line-height: 1.5;
  }
  .error-box .error-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    font-weight: 500;
  }

  footer {
    margin-top: 64px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--slate);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  footer a { color: var(--slate); }

  @media (max-width: 480px) {
    .wordmark { font-size: 25px; }
    header { flex-direction: column; gap: 14px; }
    .answer-text { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="wordmark"><span class="glyph">§</span> LexisGraph</div>
      <div class="tagline">Answers grounded in the filed document, not memory.</div>
    </div>
    <button class="settings-toggle" id="settingsToggle" type="button" aria-expanded="false" aria-controls="settingsPanel">Chambers access</button>
  </header>

  <div class="settings-panel" id="settingsPanel">
    <label for="apiKeyInput">API key (kept in this browser tab only, never sent anywhere but here)</label>
    <div class="settings-row">
      <input type="password" id="apiKeyInput" placeholder="Paste your X-API-Key" autocomplete="off">
      <button class="settings-save" id="saveKey" type="button">Save</button>
    </div>
    <div class="key-status" id="keyStatus">No key set — required to submit a question.</div>
  </div>

  <div class="brief">
    <label for="question">Put your question to the record</label>
    <textarea id="question" placeholder="e.g. What is the liability cap in this agreement?"></textarea>
    <div class="brief-footer">
      <span class="hint">Answered from the currently filed document(s)</span>
      <button class="ask-btn" id="askBtn" type="button">Submit</button>
    </div>
  </div>

  <div class="results">
    <div class="loading" id="loading">
      <span class="stamp-dots"><span></span><span></span><span></span></span>
      Reviewing the filing…
    </div>

    <div class="empty-state" id="emptyState">No filings yet. Ask a question above to begin.</div>

    <div id="output"></div>
  </div>

  <footer>
    <span>LexisGraph — hybrid retrieval legal RAG</span>
    <a href="/docs" target="_blank" rel="noopener">API reference →</a>
  </footer>

</div>

<script>
(function () {
  const settingsToggle = document.getElementById('settingsToggle');
  const settingsPanel = document.getElementById('settingsPanel');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const saveKeyBtn = document.getElementById('saveKey');
  const keyStatus = document.getElementById('keyStatus');
  const questionEl = document.getElementById('question');
  const askBtn = document.getElementById('askBtn');
  const loadingEl = document.getElementById('loading');
  const emptyState = document.getElementById('emptyState');
  const output = document.getElementById('output');

  const STORAGE_KEY = 'lexisgraph_api_key';

  function getKey() {
    try { return sessionStorage.getItem(STORAGE_KEY) || ''; }
    catch (e) { return ''; }
  }

  function setKey(k) {
    try { sessionStorage.setItem(STORAGE_KEY, k); } catch (e) {}
  }

  function refreshKeyStatus() {
    const k = getKey();
    if (k) {
      keyStatus.textContent = 'Key set for this session.';
      keyStatus.classList.add('set');
    } else {
      keyStatus.textContent = 'No key set — required to submit a question.';
      keyStatus.classList.remove('set');
    }
  }

  settingsToggle.addEventListener('click', function () {
    const isOpen = settingsPanel.classList.toggle('open');
    settingsToggle.setAttribute('aria-expanded', String(isOpen));
    if (isOpen) apiKeyInput.focus();
  });

  saveKeyBtn.addEventListener('click', function () {
    setKey(apiKeyInput.value.trim());
    apiKeyInput.value = '';
    refreshKeyStatus();
  });

  apiKeyInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') saveKeyBtn.click();
  });

  questionEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      askBtn.click();
    }
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderError(title, detail) {
    output.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'error-box';
    box.innerHTML =
      '<div class="error-title">' + escapeHtml(title) + '</div>' +
      '<div>' + escapeHtml(detail) + '</div>';
    output.appendChild(box);
  }

  function renderResult(data) {
    output.innerHTML = '';

    const ruling = document.createElement('div');
    ruling.className = 'ruling';

    const head = document.createElement('div');
    head.className = 'ruling-head';
    head.innerHTML =
      '<div class="seal-glyph">LG</div>' +
      '<div class="ruling-label">Response, filed on record</div>';
    ruling.appendChild(head);

    const answer = document.createElement('div');
    answer.className = 'answer-text';
    answer.textContent = data.answer || '(no answer returned)';
    ruling.appendChild(answer);

    const meta = document.createElement('div');
    meta.className = 'meta-row';
    const parts = [];
    if (typeof data.latency_seconds === 'number') parts.push(data.latency_seconds.toFixed(1) + 's');
    if (typeof data.kg_related_chunk_count === 'number') parts.push(data.kg_related_chunk_count + ' related via graph');
    if (Array.isArray(data.sources)) parts.push(data.sources.length + ' source' + (data.sources.length === 1 ? '' : 's'));
    meta.textContent = parts.join('  ·  ');
    ruling.appendChild(meta);

    if (Array.isArray(data.sources) && data.sources.length) {
      const sources = document.createElement('div');
      sources.className = 'sources';
      const label = document.createElement('div');
      label.className = 'sources-label';
      label.textContent = 'Cited from';
      sources.appendChild(label);

      data.sources.forEach(function (src, i) {
        const item = document.createElement('div');
        item.className = 'source-item';

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'source-toggle';
        toggle.innerHTML =
          '<span class="source-num">§' + (i + 1) + '</span>' +
          '<span class="source-doc">' + escapeHtml(src.doc_name || 'document') + ' — p.' + escapeHtml(String(src.page)) + '</span>' +
          '<span class="source-chevron">▸</span>';
        toggle.addEventListener('click', function () {
          item.classList.toggle('open');
        });

        const excerpt = document.createElement('div');
        excerpt.className = 'source-excerpt';
        excerpt.textContent = src.text || '';

        item.appendChild(toggle);
        item.appendChild(excerpt);
        sources.appendChild(item);
      });

      ruling.appendChild(sources);
    }

    output.appendChild(ruling);
  }

  async function submitQuestion() {
    const question = questionEl.value.trim();
    if (!question) {
      questionEl.focus();
      return;
    }
    const key = getKey();
    if (!key) {
      settingsPanel.classList.add('open');
      settingsToggle.setAttribute('aria-expanded', 'true');
      apiKeyInput.focus();
      renderError('Chambers access required', 'Enter your API key above before submitting a question.');
      emptyState.style.display = 'none';
      return;
    }

    emptyState.style.display = 'none';
    loadingEl.classList.add('active');
    askBtn.disabled = true;
    output.innerHTML = '';

    try {
      const res = await fetch('/query', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-API-Key': key
        },
        body: JSON.stringify({ question: question, top_k: 5, use_kg: true })
      });

      if (res.status === 401) {
        renderError('Chambers access denied', 'That API key was not accepted. Check it and try again.');
        return;
      }

      if (!res.ok) {
        let detail = 'The clerk encountered an error processing this filing.';
        try {
          const errJson = await res.json();
          if (errJson && errJson.detail) detail = String(errJson.detail);
        } catch (e) {}
        renderError('Error (' + res.status + ')', detail);
        return;
      }

      const data = await res.json();
      renderResult(data);
    } catch (err) {
      renderError('Connection error', 'Could not reach the server. It may be waking up from idle — try again in a moment.');
    } finally {
      loadingEl.classList.remove('active');
      askBtn.disabled = false;
    }
  }

  askBtn.addEventListener('click', submitQuestion);

  refreshKeyStatus();
})();
</script>
</body>
</html>
